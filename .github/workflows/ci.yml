name: CI

# Runs on every push to main and on every pull request targeting main.
# Vercel will only deploy after this passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up pnpm (must come before setup-node so the cache path is known)
      #    No version needed here — pnpm/action-setup reads it from package.json
      #    "packageManager" field automatically (e.g. pnpm@10.12.4)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. Set up Node with pnpm cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # 4. Install dependencies (includes prisma generate via postinstall)
      - name: Install dependencies
        run: pnpm install

      # 5. Run all tests
      #    Stripe and Prisma are fully mocked — no real DB or Stripe account needed.
      #    Env vars here match vitest.config.ts defaults; they only need to exist,
      #    their values don't matter since everything is mocked.
      - name: Run tests
        run: pnpm test
        env:
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
          CRON_SECRET: test-cron-secret
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
          RESEND_API_KEY: re_test_fake

      # 6. Type-check and lint (no env needed — nothing is executed)
      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest

    # Real Postgres for the route handlers (src/__tests__/integration). Only
    # Stripe/NextAuth/email/Discord/JustTCG are mocked. The suite refuses any
    # TEST_DATABASE_URL host other than localhost/127.0.0.1/postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mxyyc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mxyyc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # globalSetup pushes prisma/schema.prisma to this DB (db push --force-reset).
      - name: Run integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/mxyyc_test
